CONFIG_GPIO=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_ADC=y
CONFIG_I2C=y
CONFIG_LOG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Enable ST7789 support in LVGL and the Zephyr display driver
CONFIG_LV_USE_ST7789=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y

# SPI (display connected over SPI)
CONFIG_SPI=y

# Reduce LVGL memory usage
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_DISPLAY=y

CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# Reduce memory usage
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024