CONFIG_MATHS_LIB=n

CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_LOG=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
